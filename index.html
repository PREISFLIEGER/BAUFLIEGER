const ek = id => S.preise[id] || 0;

function status(a){
  const verf = Number(a.bestand) - Number(a.reserviert);
  if (!a.aktiv) return {l:"Ausgeblendet", c:"c-grey", knapp:false};
  if (Number(a.bestand) <= 0) return {l:"Nicht auf Lager", c:"c-grey", knapp:false};
  if (verf <= 0) return {l:"Alles reserviert", c:"c-bad", knapp:true};
  if (Number(a.mindestbestand) > 0 && verf < Number(a.mindestbestand)) return {l:"Unter Mindestbestand", c:"c-warn", knapp:true};
  if (Number(a.pro_palette) > 0 && verf < Number(a.pro_palette)) return {l:"Unter 1 Palette", c:"c-warn", knapp:true};
  return {l:"Verfügbar", c:"c-ok", knapp:false};
}

/* ===================== Start & Anmeldung ===================== */
let gestartet = false;
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "SIGNED_OUT") { S.user = null; S.me = null; stopLive(); zeigeAuth(); return; }
  if (S.reg) return;
  if (session && session.user && (!S.user || S.user.id !== session.user.id)) { S.user = session.user; setTimeout(starte, 0); }
});
(async () => {
  const {data} = await sb.auth.getSession();
  if (data && data.session) { S.user = data.session.user; await starte(); } else zeigeAuth();
  gestartet = true;
})();

let startNr = 0;
async function starte(){
  const nr = ++startNr;
  try {
    const {data, error} = await sb.from("profile").select("*").eq("id", S.user.id).maybeSingle();
    if (error) throw error;
    if (nr !== startNr) return;
    S.me = data;
    if (!S.me || !S.me.firma_id) { S.auth = S.auth === "invite" ? "invite" : "join"; zeigeAuth(); return; }
    if (!S.me.aktiv) { S.auth = "inaktiv"; zeigeAuth(); return; }
    await ladeAlles();
    if (nr !== startNr) return;
    S.tab = S.tab || (istBuero() ? "uebersicht" : "bestand");
    $("auth").hidden = true; $("app").hidden = false;
    render(); startLive();
  } catch (e) { fehler(e); zeigeAuth(); }
}

async function registrieren(fd, pruefFn, pruefArg, einloesFn, einloesArgs){
  const chk = await rpc(pruefFn, pruefArg);
  if (!chk.ok) throw new Error(chk.fehler);
  S.reg = true;
  let data;
  try { const r = await sb.auth.signUp({email: fd.get("email").trim(), password: fd.get("pw")}); if (r.error) throw r.error; data = r.data; }
  finally { S.reg = false; }
  if (!data.session) throw new Error("Konto angelegt, aber die E-Mail-Bestätigung ist in Supabase noch eingeschaltet. Bitte dort ausschalten (siehe Anleitung) oder die Bestätigungs-Mail öffnen und danach anmelden.");
  S.user = data.session.user;
  await rpc(einloesFn, einloesArgs);
  toast("Willkommen bei " + chk.firma + "!", "ok");
  await starte();
}

document.addEventListener("submit", async e => {
  const f = e.target, fid = f.getAttribute("id"); if (!fid) return;
  e.preventDefault();
  const fd = new FormData(f), btn = f.querySelector("button.p");
  if (btn) btn.disabled = true;
  try {
    if (fid === "fLogin") {
      const {error} = await sb.auth.signInWithPassword({email: fd.get("email").trim(), password: fd.get("pw")});
      if (error) throw error;
    } else if (fid === "fKey") {
      await registrieren(fd, "schluessel_pruefen", {p_schluessel: fd.get("key")}, "schluessel_einloesen", {p_schluessel: fd.get("key"), p_name: fd.get("name")});
    } else if (fid === "fInv") {
      await registrieren(fd, "einladung_pruefen", {p_code: fd.get("code")}, "einladung_einloesen", {p_code: fd.get("code"), p_name: fd.get("name"), p_telefon: fd.get("tel") || ""});
    } else if (fid === "fJoin") {
      if (fd.get("code")) await rpc("einladung_einloesen", {p_code: fd.get("code"), p_name: fd.get("name"), p_telefon: fd.get("tel") || ""});
      else await rpc("schluessel_einloesen", {p_schluessel: fd.get("key"), p_name: fd.get("name")});
      await starte();
    } else if (formHandler[fid]) {
      await formHandler[fid](fd, f);
    }
  } catch (err) { fehler(err); }
  finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
});

/* ===================== Daten laden & live ===================== */
async function ladeAlles(){
  const t = [ladeLizenz(), ladeTab("artikel"), ladeTab("bauvorhaben"), ladeTab("meldungen"), ladeTab("profile"), ladeTab("inventar"), ladeTab("reparaturen"), ladeInvBv()];
  if (istBuero()) t.push(ladeTab("artikel_preise"), ladeTab("bewegungen"), ladeReserv(), ladeTab("inventar_preise"), ladeTab("inventar_bewegungen"));
  if (istAdmin()) t.push(ladeTab("einladungen"));
  if (istHersteller()) t.push(ladeHersteller());
  await Promise.all(t);
}
async function ladeLizenz(){ S.liz = await rpc("meine_lizenz"); if (S.liz && S.liz.heute) S.heute = S.liz.heute; }
async function ladeReserv(){ S.reserv = await rpc("reservierungen"); }
async function ladeInvBv(){ try { S.invBv = await rpc("inventar_auf_baustellen") || []; } catch (e) { S.invBv = []; } }
async function ladeHersteller(){
  const [f, sys] = await Promise.all([rpc("firmen_liste"), sb.from("system").select("*").maybeSingle()]);
  S.firmen = f || []; S.system = sys.data;
}
async function ladeTab(t){
  if (t === "artikel") S.artikel = await alle("artikel", "id", true);
  else if (t === "artikel_preise") { const r = await alle("artikel_preise"); S.preise = {}; r.forEach(p => S.preise[p.artikel_id] = Number(p.ek)); }
  else if (t === "bauvorhaben") S.bv = await alle("bauvorhaben", "id", true);
  else if (t === "bewegungen") S.bew = await alle("bewegungen", "id", false);
  else if (t === "meldungen") S.meld = await alle("meldungen", "id", false);
  else if (t === "profile") { S.profile = await alle("profile", "erstellt", true); const m = S.profile.find(p => p.id === S.user.id); if (m) S.me = m; }
  else if (t === "einladungen") S.einl = await alle("einladungen", "erstellt", false);
  else if (t === "inventar") { try { S.inv = await alle("inventar", "reihenfolge", true); } catch (e) { S.inv = []; S.invFehlt = true; } }
  else if (t === "inventar_preise") { try { const r = await alle("inventar_preise"); S.invP = {}; r.forEach(p => S.invP[p.inventar_id] = p); } catch (e) {} }
  else if (t === "inventar_bewegungen") { try { S.invBew = await alle("inventar_bewegungen", "id", false); } catch (e) { S.invBew = []; } }
  else if (t === "reparaturen") { try { S.rep = await alle("reparaturen", "id", false); } catch (e) { S.rep = []; } }
}
let kanal = null, wart = new Set(), timer = null;
function startLive(){
  stopLive();
  kanal = sb.channel("bauflieger-" + S.me.firma_id)
    .on("postgres_changes", {event: "*", schema: "public"}, p => {
      if (p.table === "meldungen" && p.eventType === "INSERT" && istBuero() && p.new && p.new.von !== S.user.id) toast("Neue Meldung von " + (p.new.von_name || "Mitarbeiter") + " – unter „Eingänge“.", "");
      wart.add(p.table); clearTimeout(timer); timer = setTimeout(nachladen, 350);
    })
    .subscribe(st => { S.live = st === "SUBSCRIBED"; const el = document.querySelector(".live"); if (el) { el.classList.toggle("off", !S.live); el.lastChild.textContent = S.live ? " live" : " offline"; } });
}
function stopLive(){ if (kanal) { sb.removeChannel(kanal); kanal = null; } }
async function nachladen(){
  const t = [...wart]; wart.clear();
  try {
    const jobs = [];
    t.forEach(x => {
      if (x === "firmen" || x === "system") { jobs.push(ladeLizenz()); if (istHersteller()) jobs.push(ladeHersteller()); }
      else if (x === "artikel_preise" && !istBuero()) {}
      else if (x === "bewegungen" && !istBuero()) {}
      else if ((x === "inventar_preise" || x === "inventar_bewegungen") && !istBuero()) {}
      else if (["artikel","artikel_preise","bauvorhaben","bewegungen","meldungen","profile","inventar","inventar_preise","inventar_bewegungen","reparaturen"].includes(x)) jobs.push(ladeTab(x));
      if (x === "inventar" || x === "inventar_bewegungen") jobs.push(ladeInvBv());
      if (x === "bewegungen" && istBuero()) jobs.push(ladeReserv());
      if (x === "profile" && istHersteller()) jobs.push(ladeHersteller());
    });
    if (istAdmin() && t.includes("profile")) jobs.push(ladeTab("einladungen"));
    await Promise.all(jobs);
    if (S.me && !S.me.aktiv) { S.auth = "inaktiv"; stopLive(); zeigeAuth(); return; }
    if (!$("ov")) render(); else renderKopf();
  } catch (e) { console.warn(e); }
}
async function nachAktion(tabs){ tabs.forEach(t => wart.add(t)); await nachladen(); }

/* ===================== Oberfläche ===================== */
function tabsFuer(){
  const t = [];
  const offen = S.meld.filter(m => m.status === "offen");
  if (istBuero()) {
    t.push(["uebersicht","Übersicht"], ["bestand","Lagerbestand"], ["eingaenge","Eingänge", offen.length], ["bewegungen","Bewegungen"], ["bauvorhaben","Bauvorhaben"], ["inventar","Schalung & Geräte", S.rep.filter(r => r.status === "gemeldet").length], ["melden","Melden"]);
    if (istAdmin()) t.push(["benutzer","Benutzer"]);
    if (istHersteller()) t.push(["hersteller","Hersteller"]);
  } else {
    t.push(["bestand","Lagerbestand"], ["inventar","Schalung & Geräte"], ["melden","Material melden"], ["meine","Meine Meldungen", offen.filter(m => m.von === S.user.id).length]);
  }
  return t;
}

function render(){
  const tabs = tabsFuer();
  if (!tabs.find(x => x[0] === S.tab)) S.tab = tabs[0][0];
  $("app").innerHTML = `<div class="wrap">
    <div id="kopf"></div>
    <nav class="tabs" role="tablist" aria-label="Bereiche">${tabs.map(t => `<button role="tab" aria-selected="${S.tab === t[0]}" data-tab="${t[0]}">${esc(t[1])}${t[2] ? ` <span class="badge">${t[2]}</span>` : ""}</button>`).join("")}</nav>
    <main id="view"></main></div>`;
  renderKopf();
  const v = VIEWS[S.tab]; $("view").innerHTML = v ? v() : "";
}

function renderKopf(){

  const L = S.liz || {};

  const tage = L.bis ? Math.round((new Date(L.bis + "T12:00:00") - new Date(S.heute + "T12:00:00")) / 864e5) : 0;
  if (!L.ok) {
    const grund = L.gesperrt ? "Der Zugang ist gesperrt" : (!L.app_an ? "Die App ist derzeit nicht verfügbar" : ((L.art === "lizenz" ? "Die Lizenz ist" : "Die Testzeit ist") + " am " + deDate(L.bis) + " abgelaufen"));
    banner = `<div class="banner bad" role="alert"><span>${esc(grund)} – Lesen und Excel-Export gehen weiter, Änderungen sind gesperrt.</span><a data-act="preise">Preise &amp; Lizenz</a></div>`;
  } else if (L.art === "test" || tage <= 30 || L.meldung) {
    banner = `<div class="banner" role="status"><span>${L.art === "test" ? "Testversion" : "Lizenz"} für ${esc(L.firma)} · gültig bis ${deDate(L.bis)}${tage <= 30 ? " (noch " + tage + " Tag" + (tage === 1 ? "" : "e") + ")" : ""}</span>${L.meldung ? `<span>· ${esc(L.meldung)}</span>` : ""}<a data-act="preise">Preise &amp; Lizenz</a><a data-act="install">App aufs Handy</a></div>`;
  }
  const btns = istBuero()
    ? `<button class="btn p" data-act="buchung" ${darf() ? "" : "disabled"}>${ic.plus} Neue Buchung</button><button class="btn" data-act="artikel" ${darf() ? "" : "disabled"}>${ic.box} Neuer Artikel</button><button class="btn" data-act="excel">${ic.xls} Als Excel speichern</button>`
    : `<button class="btn p" data-tab="melden" ${darf() ? "" : "disabled"}>${ic.plus} Material ins Lager bringen</button><button class="btn" data-act="excel">${ic.xls} Bestand als Excel</button>`;
  k.innerHTML = `${banner}<header class="head">
    <div><div class="brand"><img src="logo-192.png" alt="PREISFLIEGER"><div><h1>${APP}</h1><div class="by">by <b>PREISFLIEGER</b> · ${esc(L.firma || "")} · Lager, Baustellen und Material im Griff</div></div></div>
    <div class="actions">${btns}</div></div>
    <div class="row"><span class="live ${S.live ? "" : "off"}" title="Änderungen anderer erscheinen sofort"><i></i> ${S.live ? "live" : "verbinde…"}</span>
      <button class="user" data-act="profil" title="Mein Profil"><span class="who"><b>${esc(S.me.name || S.user.email)}</b><span>${ROLLEN[S.me.rolle]}${S.me.hersteller ? " · Hersteller" : ""}</span></span></button>
      <button class="btn s" data-act="logout" title="Abmelden">${ic.out}<span class="hide-s">Abmelden</span></button></div></header>`;
  // Reiter-Zähler aktualisieren
  document.querySelectorAll(".tabs [data-tab]").forEach(b => {
    const t = tabsFuer().find(x => x[0] === b.dataset.tab); if (!t) return;
    let bd = b.querySelector(".badge"); if (t[2]) { if (!bd) { bd = document.createElement("span"); bd.className = "badge"; b.appendChild(bd); } bd.textContent = t[2]; } else if (bd) bd.remove();
  });
}

/* ---------- Übersicht ---------- */
const VIEWS = {};

  const akt = S.artikel.filter(a => a.aktiv);
  const mit = akt.filter(a => Number(a.bestand) > 0);
  let wert = 0, ohne = 0; mit.forEach(a => { if (ek(a.id)) wert += Number(a.bestand) * ek(a.id); else ohne++; });
  const knapp = akt.filter(a => status(a).knapp);
  const offen = S.meld.filter(m => m.status === "offen");
  const letzte = S.bew.slice(0, 8);
  return `<div class="kpis">
      <div class="kpi o"><span class="l">Lagerwert</span><span class="v">${eurM(wert)}</span><span class="s">${ohne ? ohne + " Artikel ohne Preis nicht enthalten" : "zum Ø Mischpreis"}</span></div>
      <button class="kpi" data-tab="bestand"><span class="l">Artikel auf Lager</span><span class="v">${mit.length}</span><span class="s">${akt.length} Artikel im Katalog</span></button>
      <button class="kpi" data-tab="eingaenge"><span class="l">Offene Meldungen</span><span class="v">${offen.length}</span><span class="s">warten auf Zubuchung</span></button>

    </div>
    <div class="two">
      <section class="card"><div class="sec"><h2>Knapp werdendes Material</h2><a href="#" data-tab="bestand" data-zeige="knapp">Alle</a></div>
        <div class="list">${knapp.slice(0, 8).map(a => { const s = status(a); return `<div class="it"><div class="grow"><div class="t">${esc(artName(a))}</div><div class="sub mono">${esc(a.artnr)}</div></div><span class="num">${nf(a.bestand - a.reserviert)} ${esc(a.einheit)}</span><span class="chip ${s.c}">${s.l}</span></div>`; }).join("") || `<div class="empty">Nichts knapp – alles im grünen Bereich.</div>`}</div></section>

/* ---------- Bestand ---------- */
VIEWS.bestand = () => {
  const F = S.f, q = F.q.trim().toLowerCase(), buero = istBuero();
  const gruppen = uniq(S.artikel.map(a => a.gruppe));
  const herst = uniq(S.artikel.filter(a => !F.gruppe || a.gruppe === F.gruppe).map(a => a.hersteller));
  let basis = S.artikel.filter(a => (!F.gruppe || a.gruppe === F.gruppe) && (!F.herst || a.hersteller === F.herst) && (!q || (a.name + " " + a.hersteller + " " + a.artnr + " " + a.gruppe).toLowerCase().includes(q)));
  let rows = basis.filter(a => F.zeige === "alle" ? a.aktiv : F.zeige === "knapp" ? a.aktiv && status(a).knapp : F.zeige === "aus" ? !a.aktiv : a.aktiv && Number(a.bestand) > 0);
  rows.sort((x, y) => (x.gruppe + x.hersteller + x.name).localeCompare(y.gruppe + y.hersteller + y.name, "de"));
  const ausgebl = basis.filter(a => a.aktiv && Number(a.bestand) <= 0).length;
  const filt = `<div class="filters">
    <label class="f w"><span>Suche</span><input class="in" type="search" data-f="q" value="${esc(F.q)}" placeholder="Material, Hersteller oder Artikel-Nr."></label>
    <label class="f"><span>Materialgruppe</span><select class="in" data-f="gruppe"><option value="">Alle Gruppen</option>${gruppen.map(g => `<option ${g === F.gruppe ? "selected" : ""}>${esc(g)}</option>`).join("")}</select></label>
    <label class="f"><span>Hersteller</span><select class="in" data-f="herst"><option value="">Alle Hersteller</option>${herst.map(g => `<option ${g === F.herst ? "selected" : ""}>${esc(g)}</option>`).join("")}</select></label>
    <label class="f"><span>Anzeigen</span><select class="in" data-f="zeige">${[["vorhanden","Nur was im Lager ist"],["knapp","Nur knappes Material"],["alle","Ganzer Katalog"]].concat(buero ? [["aus","Ausgeblendete Artikel"]] : []).map(o => `<option value="${o[0]}" ${o[0] === F.zeige ? "selected" : ""}>${o[1]}</option>`).join("")}</select></label></div>
    <p class="count">${rows.length} Artikel${F.zeige === "vorhanden" && ausgebl ? ` · ${ausgebl} ohne Bestand ausgeblendet (»Anzeigen« → Ganzer Katalog)` : ""}</p>`;
  if (!buero) {
    return filt + `<div class="cards">${rows.map(a => { const s = status(a), v = Number(a.bestand) - Number(a.reserviert); return `<div class="mcard"><div class="grow"><div class="t" style="font-weight:600">${esc(a.name)}</div><div class="sub muted" style="font-size:13px">${esc(a.hersteller)} · ${esc(a.gruppe)}${a.pro_palette > 0 ? " · ca. " + nf(v / a.pro_palette, 1) + " Paletten" : ""}</div></div><div style="text-align:right"><div class="big">${nf(v)} ${esc(a.einheit)}</div><span class="chip ${s.c}">${s.l}</span></div></div>`; }).join("") || `<div class="empty card">Kein Material in dieser Auswahl.</div>`}</div>`;
  }
  return filt + `<div class="tbl"><table><thead><tr><th>Material</th><th>Artikel-Nr.</th><th class="num">Bestand</th><th class="num">Reserviert</th><th class="num">Verfügbar</th><th class="num">Paletten</th><th class="num">Ø Mischpreis</th><th class="num">Lagerwert</th><th>Status</th><th><span class="sr">Aktionen</span></th></tr></thead><tbody>
    ${rows.map(a => { const s = status(a), v = Number(a.bestand) - Number(a.reserviert), p = ek(a.id); return `<tr>
      <td><div class="t">${esc(a.name)}</div><div class="sub">${esc(a.hersteller)} · ${esc(a.gruppe)}</div></td>
      <td class="mono">${esc(a.artnr) || "–"}</td>
      <td class="num">${nf(a.bestand)} ${esc(a.einheit)}</td>
      <td class="num" style="color:var(--violet-ink)">${Number(a.reserviert) ? nf(a.reserviert) : "–"}</td>
      <td class="num"><b>${nf(v)}</b></td>
      <td class="num">${a.pro_palette > 0 ? nf(a.bestand / a.pro_palette, 1) : "–"}</td>
      <td class="num">${p ? eur(p) : '<span class="chip c-warn">Preis fehlt</span>'}</td>
      <td class="num">${p ? eur(p * a.bestand) : "–"}</td>
      <td><span class="chip ${s.c}">${s.l}</span></td>
      <td><div class="row" style="flex-wrap:nowrap"><button class="btn s" data-act="artikel" data-id="${a.id}" ${darf() ? "" : "disabled"}>Bearbeiten</button><button class="btn s" data-act="inventur" data-id="${a.id}" ${darf() ? "" : "disabled"}>Inventur</button></div></td></tr>`; }).join("")}
    </tbody></table>${rows.length ? "" : `<div class="empty">Kein Material in dieser Auswahl.</div>`}</div>
    <p class="hint" style="margin-top:10px">Ø Mischpreis = gleitender Durchschnitt aus Eingängen und Retouren, gewichtet nach Menge. Ausgaben werden zum Mischpreis des Buchungstages bewertet; der Preis jeder Buchung bleibt fixiert.</p>`;
};

/* ---------- Eingänge ---------- */
VIEWS.eingaenge = () => {
  const offen = S.meld.filter(m => m.status === "offen");
  const fertig = S.meld.filter(m => m.status !== "offen").slice(0, 10);
  return `<p class="hint" style="margin:0 0 14px">Meldungen von Lager und Baustelle. Erst nach Prüfung und Zubuchung durch das Büro ändert sich der Lagerstand.</p>
   <div class="cards">${offen.map(m => { const a = art(m.artikel_id); const p = ek(m.artikel_id); return `<article class="card meld">
      <div style="flex:1 1 320px;min-width:0"><div class="row"><span class="chip ${m.art === "LIEFERUNG" ? "c-ok" : "c-blue"}">${m.art === "LIEFERUNG" ? "Lieferung" : "Retoure"}</span><span class="muted" style="font-size:13px">${deTime(m.erstellt)} · von ${esc(m.von_name)}</span></div>
        <div style="font-size:18px;font-weight:600;margin-top:6px">${esc(artName(a))}</div>
        <div class="muted" style="font-size:14px"><b style="color:var(--ink)">${mengeTxt(m)}</b> (${nf(m.stueck)} ${esc(a ? a.einheit : "")}) · ${m.bauvorhaben_id ? "von Baustelle " + esc(bvName(m.bauvorhaben_id)) : "Wareneingang"}</div>
        ${m.notiz ? `<div class="muted" style="font-style:italic;margin-top:4px">»${esc(m.notiz)}«</div>` : ""}</div>
      <div class="row" style="align-items:flex-end">
        <label class="f" style="width:150px"><span>Preis je ${esc(a ? a.einheit : "Stk.")} €</span><input class="in num" inputmode="decimal" data-preis="${m.id}" value="${p ? nf(p, 2) : ""}" placeholder="ohne Preis"></label>
        <button class="btn" data-act="ablehnen" data-id="${m.id}" ${darf() ? "" : "disabled"}>Ablehnen</button>
        <button class="btn p" data-act="zubuchen" data-id="${m.id}" ${darf() ? "" : "disabled"}>Prüfen &amp; zubuchen</button></div>
      <div class="hint" style="flex-basis:100%" data-misch="${m.id}">${mischTxt(m, p)}</div></article>`; }).join("") || `<div class="card empty">Alles erledigt – keine offenen Meldungen.</div>`}</div>
   ${fertig.length ? `<h2 class="cond" style="margin:24px 0 8px;text-transform:uppercase;letter-spacing:.04em">Zuletzt bearbeitet</h2><div class="tbl"><table><tbody>${fertig.map(m => `<tr><td><span class="chip ${m.status === "gebucht" ? "c-ok" : "c-bad"}">${m.status === "gebucht" ? "Gebucht" : "Abgelehnt"}</span></td><td>${esc(artName(art(m.artikel_id)))}<div class="sub">${mengeTxt(m)} · von ${esc(m.von_name)}</div></td><td class="sub">${m.erledigt_am ? deTime(m.erledigt_am) : ""} · ${esc(m.erledigt_von)}${m.grund ? " · " + esc(m.grund) : ""}</td></tr>`).join("")}</tbody></table></div>` : ""}`;
};
function mischTxt(m, preis){
  const a = art(m.artikel_id); if (!a) return "";
  const alt = ek(a.id), b = Number(a.bestand), stk = Number(m.stueck);
  if (!preis) return alt ? "Ohne Preis wird der Mischpreis nicht verändert (" + eur(alt) + ")." : "Ohne Preis – Artikel bleibt ohne Mischpreis.";
  const neu = alt > 0 && b > 0 ? (b * alt + stk * preis) / (b + stk) : preis;
  return "Neuer Ø Mischpreis: <b>" + eur(neu) + "</b>" + (alt ? " (bisher " + eur(alt) + ")" : " (bisher kein Preis)") + " · danach im Lager " + nf(b + stk) + " " + esc(a.einheit);
}

/* ---------- Bewegungen ---------- */
VIEWS.bewegungen = () => {
  const F = S.f, jahre = uniq(S.bew.map(b => String(b.datum).slice(0, 4)).concat([S.heute.slice(0, 4)])).reverse();
  if (!F.jahr) F.jahr = S.heute.slice(0, 4);
  const mq = F.mq.trim().toLowerCase();
  const rows = S.bew.filter(b => (F.jahr === "alle" || String(b.datum).startsWith(F.jahr)) && (!F.monat || String(b.datum).slice(5, 7) === F.monat) && (!F.art || b.art === F.art) && (!F.bvf || String(b.bauvorhaben_id) === F.bvf) && (!mq || artName(art(b.artikel_id)).toLowerCase().includes(mq)))
    .sort((x, y) => x.datum < y.datum ? 1 : x.datum > y.datum ? -1 : y.id - x.id);
  const bvs = S.bv.slice().sort((a, b) => a.name.localeCompare(b.name, "de"));
  return `<div class="filters">
    <label class="f"><span>Jahr</span><select class="in" data-f="jahr">${jahre.map(j => `<option ${j === F.jahr ? "selected" : ""}>${j}</option>`).join("")}<option value="alle" ${F.jahr === "alle" ? "selected" : ""}>Alle Jahre</option></select></label>
    <label class="f"><span>Monat</span><select class="in" data-f="monat"><option value="">Ganzes Jahr</option>${MONATE.map((m, i) => { const v = String(i + 1).padStart(2, "0"); return `<option value="${v}" ${v === F.monat ? "selected" : ""}>${m}</option>`; }).join("")}</select></label>
    <label class="f"><span>Art</span><select class="in" data-f="art"><option value="">Alle Arten</option>${Object.keys(ARTEN).map(k => `<option value="${k}" ${k === F.art ? "selected" : ""}>${ARTEN[k].l}</option>`).join("")}</select></label>
    <label class="f"><span>Bauvorhaben</span><select class="in" data-f="bvf"><option value="">Alle</option>${bvs.map(b => `<option value="${b.id}" ${String(b.id) === F.bvf ? "selected" : ""}>${esc(b.name)}</option>`).join("")}</select></label>
    <label class="f w"><span>Material</span><input class="in" type="search" data-f="mq" value="${esc(F.mq)}" placeholder="Material suchen"></label></div>
   <p class="count">${rows.length} Bewegung${rows.length === 1 ? "" : "en"} · Ein neues Jahr erscheint automatisch, sobald darin gebucht wird.</p>
   <div class="tbl"><table><thead><tr><th>Datum</th><th>Art</th><th>Material</th><th>Bauvorhaben / Lieferant</th><th class="num">Menge</th><th class="num">Grundeinheit</th><th class="num">Preis</th><th class="num">Wert</th><th>Gebucht von</th></tr></thead><tbody>
   ${rows.slice(0, 500).map(b => { const a = art(b.artikel_id); return `<tr><td class="num">${deDate(b.datum)}</td><td><span class="chip ${ARTEN[b.art].c}">${ARTEN[b.art].l}</span></td><td><div class="t">${esc(artName(a))}</div>${b.bemerkung ? `<div class="sub">${esc(b.bemerkung)}</div>` : ""}</td><td>${esc(bvName(b.bauvorhaben_id) || b.lieferant || "–")}</td><td class="num">${mengeTxt(b)}</td><td class="num">${nf(b.stueck)} ${esc(a ? a.einheit : "")}</td><td class="num">${b.preis != null ? eur(b.preis) : "–"}</td><td class="num">${b.preis != null ? eur(b.preis * Math.abs(b.stueck)) : "–"}</td><td class="sub">${esc(b.gebucht_name)}</td></tr>`; }).join("")}
   </tbody></table>${rows.length ? "" : `<div class="empty">Keine Bewegungen in dieser Auswahl.</div>`}${rows.length > 500 ? `<div class="empty">Es werden die neuesten 500 angezeigt – bitte Filter verwenden oder als Excel speichern.</div>` : ""}</div>`;
};

/* ---------- Bauvorhaben ---------- */
VIEWS.bauvorhaben = () => {
  const F = S.f, jahre = uniq(S.bv.map(b => String(b.beginn).slice(0, 4)).concat(S.bew.map(b => String(b.datum).slice(0, 4))).concat([S.heute.slice(0, 4)])).reverse();
  if (!F.bvJahr) F.bvJahr = S.heute.slice(0, 4);
  const q = F.bvq.trim().toLowerCase(), J = F.bvJahr;
  const rows = S.bv.filter(b => (F.bvStatus === "alle" || b.status === F.bvStatus) && (!q || (b.nr + " " + b.name + " " + b.ort + " " + b.kunde).toLowerCase().includes(q))
    && (J === "alle" || String(b.beginn).startsWith(J) || S.bew.some(m => m.bauvorhaben_id === b.id && String(m.datum).startsWith(J))))
    .sort((a, b) => (b.nr || "").localeCompare(a.nr || "", "de"));
  const resPos = id => S.reserv.filter(r => r.bauvorhaben_id === id);
  return `<div class="filters">
    <label class="f"><span>Jahr</span><select class="in" data-f="bvJahr">${jahre.map(j => `<option ${j === J ? "selected" : ""}>${j}</option>`).join("")}<option value="alle" ${J === "alle" ? "selected" : ""}>Alle Jahre</option></select></label>
    <label class="f"><span>Status</span><select class="in" data-f="bvStatus">${[["laufend","Laufend"],["abgeschlossen","Abgeschlossen"],["alle","Alle"]].map(o => `<option value="${o[0]}" ${o[0] === F.bvStatus ? "selected" : ""}>${o[1]}</option>`).join("")}</select></label>
    <label class="f w"><span>Suche</span><input class="in" type="search" data-f="bvq" value="${esc(F.bvq)}" placeholder="Name, Ort, Kunde oder Nummer"></label>
    <button class="btn p" data-act="bv" ${darf() ? "" : "disabled"}>${ic.plus} Neues Bauvorhaben</button></div>
   <p class="count">${rows.length} Bauvorhaben${J !== "alle" ? " mit Beginn oder Buchungen in " + J : ""} · Kosten zu den fixierten Buchungspreisen${J !== "alle" ? " in " + J : ""}</p>
   <div class="bvgrid">${rows.map(b => {
      let aus = 0, ret = 0, n = 0;
      S.bew.forEach(m => { if (m.bauvorhaben_id !== b.id || (J !== "alle" && !String(m.datum).startsWith(J))) return; const w = (m.preis || 0) * m.stueck; if (m.art === "AUSGABE") { aus += w; n++; } if (m.art === "RETOURE") { ret += w; n++; } });
      const rp = resPos(b.id), done = b.status === "abgeschlossen";
      return `<article class="card"><div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap"><div style="min-width:0"><div class="sub mono muted" style="font-size:12px">${esc(b.nr)} · seit ${deDate(b.beginn)}</div><div style="font-size:18px;font-weight:600">${esc(b.name)}</div><div class="muted" style="font-size:14px">${esc([b.ort, b.kunde].filter(Boolean).join(" · ") || "–")}</div></div><span class="chip ${done ? "c-grey" : "c-ok"}">${done ? "Abgeschlossen" : "Laufend"}</span></div>
       <div class="kv"><div><span>Ausgegeben</span><b>${eur(aus)}</b></div><div><span>Retour</span><b>${eur(ret)}</b></div><div><span>Materialkosten netto</span><b>${eur(aus - ret)}</b></div><div><span>Offen reserviert</span><b style="color:var(--violet-ink)">${rp.length ? rp.length + " Position" + (rp.length === 1 ? "" : "en") : "–"}</b></div></div>
       ${rp.length ? `<div class="sub muted" style="font-size:12px;margin-top:8px">${rp.map(r => esc(artName(art(r.artikel_id))) + ": " + nf(r.stueck)).join(" · ")}</div>` : ""}
       <div class="row" style="margin-top:12px"><button class="btn s" data-act="bvbew" data-id="${b.id}">Bewegungen (${n})</button><button class="btn s" data-act="bv" data-id="${b.id}" ${darf() ? "" : "disabled"}>Bearbeiten</button><button class="btn s" data-act="bvstatus" data-id="${b.id}" ${darf() ? "" : "disabled"}>${done ? "Wieder öffnen" : "Abschließen"}</button></div></article>`; }).join("")}</div>
   ${rows.length ? "" : `<div class="card empty">Keine Bauvorhaben in dieser Auswahl.</div>`}`;
};

/* ---------- Melden ---------- */
let M = {art: "RETOURE", artikel: "", menge: 1, einheit: "Palette", bv: "", notiz: ""};
VIEWS.melden = () => {
  const akt = S.artikel.filter(a => a.aktiv).sort((x, y) => (x.gruppe + x.hersteller + x.name).localeCompare(y.gruppe + y.hersteller + y.name, "de"));
  if (!M.artikel && akt[0]) M.artikel = String(akt[0].id);
  const a = art(Number(M.artikel)), eh = a && a.pro_palette > 0 ? ["Palette", a.einheit] : [a ? a.einheit : "Stk."];
  if (!eh.includes(M.einheit)) M.einheit = eh[0];
  const lauf = S.bv.filter(b => b.status === "laufend").sort((x, y) => x.name.localeCompare(y.name, "de"));
  const stk = M.einheit === "Palette" && a ? M.menge * a.pro_palette : M.menge;
  return `<form id="fMeld" class="card stack" style="max-width:640px">
    <div><span class="cond" style="font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.04em">Was bringst du ins Lager?</span><p class="hint" style="margin:4px 0 0">Die Meldung geht ans Büro. Erst nach dem Zubuchen ändert sich der Bestand.</p></div>
    <div class="pills" role="group" aria-label="Art"><button type="button" data-m="art" data-v="RETOURE" aria-pressed="${M.art === "RETOURE"}">Retoure von Baustelle</button><button type="button" data-m="art" data-v="LIEFERUNG" aria-pressed="${M.art === "LIEFERUNG"}">Lieferung vom Händler</button></div>
    <label class="f"><span>Material</span><select class="in" data-m="artikel">${gruppenOptionen(akt, M.artikel, false)}</select></label>
    <div class="row" style="align-items:flex-end"><div class="f" style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Menge</span>
      <div class="step"><button type="button" data-m="minus" aria-label="Weniger">−</button><input inputmode="decimal" data-m="menge" value="${nf(M.menge)}" aria-label="Menge"><button type="button" data-m="plus" aria-label="Mehr">+</button></div></div>
      <div class="pills" role="group" aria-label="Einheit">${eh.map(e => `<button type="button" data-m="einheit" data-v="${esc(e)}" aria-pressed="${M.einheit === e}">${esc(e)}</button>`).join("")}</div></div>
    <p class="hint" style="margin:0">= ${nf(stk)} ${esc(a ? a.einheit : "")}${M.einheit === "Palette" && a ? " (" + nf(a.pro_palette) + " je Palette)" : ""}</p>
    ${M.art === "RETOURE" ? `<label class="f"><span>Von welcher Baustelle?</span><select class="in" data-m="bv" required><option value="">Bitte wählen</option>${lauf.map(b => `<option value="${b.id}" ${String(b.id) === M.bv ? "selected" : ""}>${esc(b.name)}${b.ort ? " · " + esc(b.ort) : ""}</option>`).join("")}</select></label>` : ""}
    <label class="f"><span>Notiz (optional)</span><textarea class="in" data-m="notiz" placeholder="z. B. Zustand, Lagerplatz, Lieferschein-Nr.">${esc(M.notiz)}</textarea></label>
    <button class="btn p" style="min-height:52px;font-size:17px" ${darf() ? "" : "disabled"}>An Büro melden</button></form>`;
};
VIEWS.meine = () => {
  const mine = S.meld.filter(m => m.von === S.user.id);
  return `<div class="cards">${mine.map(m => `<div class="mcard"><div class="grow"><div style="font-weight:600">${mengeTxt(m)} ${esc(artName(art(m.artikel_id)))}</div><div class="muted" style="font-size:13px">${m.art === "LIEFERUNG" ? "Lieferung" : "Retoure · " + esc(bvName(m.bauvorhaben_id))} · ${deTime(m.erstellt)}${m.grund ? " · " + esc(m.grund) : ""}</div></div><span class="chip ${m.status === "offen" ? "c-org" : m.status === "gebucht" ? "c-ok" : "c-bad"}">${m.status === "offen" ? "Wartet auf Büro" : m.status === "gebucht" ? "Zugebucht" : "Abgelehnt"}</span></div>`).join("") || `<div class="card empty">Noch keine Meldungen.</div>`}</div>`;
};
function gruppenOptionen(liste, sel, mitBestand){
  const g = uniq(liste.map(a => a.gruppe));
  return g.map(gr => `<optgroup label="${esc(gr)}">${liste.filter(a => a.gruppe === gr).map(a => `<option value="${a.id}" ${String(a.id) === String(sel) ? "selected" : ""}>${esc(a.hersteller + " – " + a.name)}${mitBestand ? " · frei " + nf(a.bestand - a.reserviert) + " " + esc(a.einheit) : ""}</option>`).join("")}</optgroup>`).join("");
}

/* ---------- Benutzer ---------- */
VIEWS.benutzer = () => {
  const L = S.liz || {}, aktiv = S.profile.filter(p => p.aktiv).length;
  const offen = S.einl.filter(e => !e.benutzt_am && new Date(e.gueltig_bis) > new Date());
  return `<div class="two">
   <section class="card"><div class="sec"><h2>Benutzer</h2><span class="chip ${aktiv >= L.max_benutzer ? "c-warn" : "c-grey"}">${aktiv} von ${L.max_benutzer} · Paket ${esc((PAKETE.find(p => p.id === L.paket) || {}).l || L.paket)}</span></div>
    <div class="list">${S.profile.map(p => `<div class="it" style="flex-wrap:wrap"><div class="grow"><div class="t" style="font-weight:600">${esc(p.name)}${p.id === S.user.id ? " (Sie)" : ""}</div><div class="sub muted" style="font-size:13px">${esc(p.email)}${p.telefon ? ` · <a href="tel:${esc(p.telefon.replace(/[^0-9+]/g, ""))}">${esc(p.telefon)}</a>` : ""}</div></div>
      <select class="in" style="width:160px" data-rolle="${p.id}" ${darf() ? "" : "disabled"} aria-label="Rolle von ${esc(p.name)}">${Object.keys(ROLLEN).map(r => `<option value="${r}" ${r === p.rolle ? "selected" : ""}>${ROLLEN[r]}</option>`).join("")}</select>
      <button class="btn s ${p.aktiv ? "d" : ""}" data-act="aktiv" data-id="${p.id}" ${darf() ? "" : "disabled"}>${p.aktiv ? "Deaktivieren" : "Aktivieren"}</button></div>`).join("")}</div>
    <p class="hint">Mitarbeiter sehen Bestand und Baustellen, aber keine Preise, keinen Lagerwert und keine Buchungen. Büro und Administrator dürfen buchen; nur Administratoren verwalten Benutzer.</p></section>
   <section class="card"><div class="sec"><h2>Einladen</h2></div>
    <form id="fEinl" class="row" style="align-items:flex-end"><label class="f" style="flex:1"><span>Rolle</span><select class="in" name="rolle"><option value="mitarbeiter">Mitarbeiter (ohne Preise)</option><option value="buero">Büro</option><option value="admin">Administrator</option></select></label><button class="btn p" ${darf() ? "" : "disabled"}>Einladungscode erzeugen</button></form>
    <div id="einlOut"></div>
    <h3 class="cond" style="margin:18px 0 6px;font-size:18px;text-transform:uppercase;letter-spacing:.04em">Offene Einladungen</h3>
    <div class="list">${offen.map(e => `<div class="it"><span class="mono" style="font-weight:600">${e.code.slice(0, 4)}-${e.code.slice(4)}</span><div class="grow muted" style="font-size:13px">${ROLLEN[e.rolle]} · gültig bis ${deDate(e.gueltig_bis)}</div><button class="btn s d" data-act="einlDel" data-id="${e.code}">Löschen</button></div>`).join("") || `<div class="muted">Keine offenen Einladungen.</div>`}</div>

/* ---------- Schalung & Geräte ---------- */
const BEREICHE = {schalung: "Schalung", leihmaterial: "Leihmaterial", leihgeraet: "Leihgeräte", geruest: "Rollgerüst"};
const REPST = {gemeldet: {l: "Gemeldet", c: "c-warn"}, reparatur: {l: "In Reparatur", c: "c-blue"}, erledigt: {l: "Repariert", c: "c-ok"}, ausgeschieden: {l: "Ausgeschieden", c: "c-bad"}, abgelehnt: {l: "Abgelehnt", c: "c-grey"}};
const inv = id => S.inv.find(i => i.id === Number(id));
const invFrei = i => Number(i.gesamt) - Number(i.baustelle) - Number(i.reparatur);
const tageSeit = d => Math.max(0, Math.round((new Date(S.heute + "T12:00:00") - new Date(String(d).slice(0, 10) + "T12:00:00")) / 864e5));
function invStatus(i){
  if (!i.gezaehlt) return {l: "Noch nicht gezählt", c: "c-grey"};
  const f = invFrei(i);
  if (Number(i.gesamt) <= 0) return {l: Number(i.nachbestellen) > 0 ? "Fehlt – bestellen" : "Nicht vorhanden", c: Number(i.nachbestellen) > 0 ? "c-bad" : "c-grey"};
  if (f <= 0) return {l: Number(i.baustelle) > 0 ? "Alles draußen" : "Nichts frei", c: "c-bad"};
  if (Number(i.nachbestellen) > 0) return {l: "Nachbestellen", c: "c-warn"};
  return {l: "Im Lager", c: "c-ok"};
}
VIEWS.inventar = () => {
  if (S.invFehlt) return `<div class="card"><b>Dieser Bereich ist noch nicht eingerichtet.</b><p class="hint">Bitte in Supabase das Skript „bauflieger-update-2.sql“ ausführen und die App neu laden.</p></div>`;
  const F = S.f, buero = istBuero();
  const imBereich = S.inv.filter(i => i.bereich === F.ib && i.aktiv);
  const offeneRep = S.rep.filter(r => r.status === "gemeldet" || r.status === "reparatur");
  const nb = S.inv.filter(i => i.aktiv && Number(i.nachbestellen) > 0);
  const bereiche = `<div class="bereiche" role="group" aria-label="Bereich">${Object.keys(BEREICHE).map(b => { const n = S.inv.filter(i => i.bereich === b && i.aktiv).length; return `<button data-ib="${b}" aria-pressed="${F.ib === b}">${BEREICHE[b]} <span class="badge g">${n}</span></button>`; }).join("")}</div>`;
  const modi = [["bestand","Bestand"],["baustellen","Auf Baustellen", S.invBv.filter(x => (inv(x.inventar_id) || {}).bereich === F.ib).length],["reparatur","Reparatur", offeneRep.filter(r => (inv(r.inventar_id) || {}).bereich === F.ib).length]].concat(buero ? [["nachkauf","Nachkauf & Belege"],["nachbestellen","Nachbestellen", nb.filter(i => i.bereich === F.ib).length]] : []);
  const modiHtml = `<div class="modi" role="tablist">${modi.map(m => `<button role="tab" data-imod="${m[0]}" aria-selected="${F.imod === m[0]}">${m[1]}${m[2] ? ` <span class="badge">${m[2]}</span>` : ""}</button>`).join("")}</div>`;
  let body = "";
  if (F.imod === "baustellen") body = invBaustellen();
  else if (F.imod === "reparatur") body = invReparatur();
  else if (F.imod === "nachkauf" && buero) body = invNachkauf();
  else if (F.imod === "nachbestellen" && buero) body = invNachbestellen();
  else body = invBestand(imBereich);
  return bereiche + modiHtml + body;
};
function invBestand(liste){
  const F = S.f, buero = istBuero(), q = F.iq.trim().toLowerCase();
  const gruppen = uniq(liste.map(i => i.gruppe));
  let rows = liste.filter(i => (!F.ig || i.gruppe === F.ig) && (!q || (i.name + " " + i.artnr + " " + i.artnr_verrechnung + " " + i.gruppe + " " + i.notiz).toLowerCase().includes(q)));
  rows = rows.filter(i => F.iz === "frei" ? i.gezaehlt && invFrei(i) > 0 : F.iz === "draussen" ? Number(i.baustelle) > 0 : F.iz === "zaehlen" ? !i.gezaehlt : F.iz === "rep" ? Number(i.reparatur) > 0 : true);
  const zuZaehlen = liste.filter(i => !i.gezaehlt).length;
  const lm = F.ib === "leihmaterial", lg = F.ib === "leihgeraet";
  const filt = `<div class="filters">
    <label class="f w"><span>Suche</span><input class="in" type="search" data-f="iq" value="${esc(F.iq)}" placeholder="Bezeichnung oder Artikel-Nr."></label>
    <label class="f"><span>Gruppe</span><select class="in" data-f="ig"><option value="">Alle Gruppen</option>${gruppen.map(g => `<option ${g === F.ig ? "selected" : ""}>${esc(g)}</option>`).join("")}</select></label>
    <label class="f"><span>Anzeigen</span><select class="in" data-f="iz">${[["alle","Alles"],["frei","Nur was im Lager frei ist"],["draussen","Nur was auf Baustellen ist"],["rep","Nur mit Reparatur"],["zaehlen","Noch zu zählen"]].map(o => `<option value="${o[0]}" ${o[0] === F.iz ? "selected" : ""}>${o[1]}</option>`).join("")}</select></label>
    ${buero ? `<button class="btn" data-act="invEdit" ${darf() ? "" : "disabled"}>${ic.plus} Neuer Eintrag</button>` : ""}</div>
    <p class="count">${rows.length} Einträge${zuZaehlen ? ` · <b>${zuZaehlen} noch nicht gezählt</b> – ${buero ? "mit „Zählen“ die Anzahl im Lager eintragen" : "das Büro trägt die Anzahl ein"}` : ""}</p>`;
  if (!buero) {
    return filt + `<div class="cards">${rows.map(i => { const s = invStatus(i); return `<div class="mcard"><div class="grow"><div style="font-weight:600">${esc(i.name)}</div><div class="muted" style="font-size:13px">${esc(i.gruppe)}${i.artnr ? " · " + esc(i.artnr) : ""}${Number(i.baustelle) ? " · " + nf(i.baustelle) + " auf Baustellen" : ""}${Number(i.reparatur) ? " · " + nf(i.reparatur) + " in Reparatur" : ""}</div>${i.notiz ? `<div class="muted" style="font-size:12px;font-style:italic">${esc(i.notiz)}</div>` : ""}</div><div style="text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end"><div class="big">${i.gezaehlt ? nf(invFrei(i)) + " " + esc(i.einheit) : "?"}</div><span class="chip ${s.c}">${s.l}</span><button class="btn s" data-act="invKaputt" data-id="${i.id}" ${darf() ? "" : "disabled"}>Kaputt melden</button></div></div>`; }).join("") || `<div class="card empty">Nichts in dieser Auswahl.</div>`}</div>`;
  }
  let html = "", gAlt = null;
  rows.forEach(i => {
    if (i.gruppe !== gAlt) { gAlt = i.gruppe; html += `<tr class="ghead"><td colspan="${lg ? 9 : 8}">${esc(i.gruppe || "Ohne Gruppe")}</td></tr>`; }
    const s = invStatus(i), pr = S.invP[i.id] || {};
    html += `<tr><td><div class="t">${esc(i.name)}</div>${i.notiz ? `<div class="sub" style="font-style:italic">${esc(i.notiz)}</div>` : ""}</td>
      <td class="mono" style="font-size:13px">${esc(i.artnr) || "–"}${lm && i.artnr_verrechnung ? `<div class="sub">Verr. ${esc(i.artnr_verrechnung)}</div>` : ""}</td>
      <td class="num">${i.gezaehlt ? nf(i.gesamt) : "?"}</td><td class="num"><b>${i.gezaehlt ? nf(invFrei(i)) : "?"}</b></td>
      <td class="num">${Number(i.baustelle) ? nf(i.baustelle) : "–"}</td><td class="num" style="color:var(--danger)">${Number(i.reparatur) ? nf(i.reparatur) : "–"}</td>
      ${lg ? `<td style="font-size:13px">${esc(pr.miete_exkl || "–")}${pr.miete_inkl ? `<div class="sub">inkl. ${esc(pr.miete_inkl)}</div>` : ""}</td>` : ""}
      <td><span class="chip ${s.c}">${s.l}</span>${Number(i.nachbestellen) > 0 ? `<div class="sub" style="margin-top:3px">${nf(i.nachbestellen)} nachbestellen</div>` : ""}</td>
      <td><div class="row" style="flex-wrap:nowrap">
        <button class="btn s" data-act="invBuch" data-art="AUSGABE" data-id="${i.id}" ${darf() ? "" : "disabled"}>Ausgeben</button>
        <button class="btn s" data-act="invBuch" data-art="RUECKGABE" data-id="${i.id}" ${darf() && Number(i.baustelle) > 0 ? "" : "disabled"}>Zurück</button>
        <button class="btn s" data-act="invKaputt" data-id="${i.id}" ${darf() ? "" : "disabled"}>Kaputt</button>
        <button class="btn s" data-act="invZaehlen" data-id="${i.id}" ${darf() ? "" : "disabled"}>Zählen</button>
        <button class="btn s" data-act="invEdit" data-id="${i.id}" ${darf() ? "" : "disabled"} aria-label="Bearbeiten">✎</button></div></td></tr>`;
  });
  return filt + `<div class="tbl"><table><thead><tr><th>Bezeichnung</th><th>Art.-Nr.</th><th class="num">Gesamt</th><th class="num">Im Lager</th><th class="num">Baustelle</th><th class="num">Reparatur</th>${lg ? "<th>Leihgebühr exkl.</th>" : ""}<th>Status</th><th><span class="sr">Aktionen</span></th></tr></thead><tbody>${html}</tbody></table>${rows.length ? "" : `<div class="empty">Nichts in dieser Auswahl.</div>`}</div>
    <p class="hint" style="margin-top:10px">Im Lager = Gesamt − auf Baustellen − in Reparatur. „Zählen“ trägt ein, was einsatzbereit im Lager liegt – Baustelle und Reparatur werden automatisch dazugerechnet.</p>`;
}
function invBaustellen(){
  const F = S.f, buero = istBuero();
  const liste = S.invBv.filter(x => { const i = inv(x.inventar_id); return i && i.bereich === F.ib; });
  if (!liste.length) return `<div class="card empty">Aus dem Bereich ${BEREICHE[F.ib]} ist derzeit nichts auf Baustellen.</div>`;
  const bvIds = uniq(liste.map(x => x.bauvorhaben_id));
  return `<div class="bvgrid">${bvIds.map(id => { const pos = liste.filter(x => x.bauvorhaben_id === id); const b = S.bv.find(y => y.id === id) || {name: "?"};
    return `<article class="card"><div class="sec"><h2 style="font-size:20px">${esc(b.name)}</h2><span class="muted" style="font-size:13px">${esc(b.ort || "")}</span></div><div class="list">${pos.map(x => { const i = inv(x.inventar_id), pr = S.invP[i.id] || {}, t = x.seit ? tageSeit(x.seit) : null;
      return `<div class="it"><div class="grow"><div style="font-weight:600">${nf(x.menge)} ${esc(i.einheit)} ${esc(i.name)}</div><div class="sub muted" style="font-size:12px">${x.seit ? "seit " + deDate(x.seit) + " (" + t + (t === 1 ? " Tag" : " Tage") + ")" : ""}${buero && pr.miete_exkl ? " · Leihgebühr " + esc(pr.miete_exkl) : ""}</div></div>${buero ? `<button class="btn s" data-act="invBuch" data-art="RUECKGABE" data-id="${i.id}" data-bv="${id}" ${darf() ? "" : "disabled"}>Zurück</button>` : ""}</div>`; }).join("")}</div></article>`; }).join("")}</div>
    <p class="hint" style="margin-top:10px">„seit“ = letzte Ausgabe an diese Baustelle. ${buero ? "Für die Verrechnung der Leihgebühren die Tage × Tarif nehmen." : ""}</p>`;
}
function invReparatur(){
  const F = S.f, buero = istBuero();
  const rows = S.rep.filter(r => { const i = inv(r.inventar_id); return i && i.bereich === F.ib && (F.rf === "alle" || (F.rf === "offen" ? (r.status === "gemeldet" || r.status === "reparatur") : !(r.status === "gemeldet" || r.status === "reparatur"))); });
  return `<div class="row" style="margin-bottom:12px"><div class="pills" role="group" aria-label="Status">${[["offen","Offen"],["fertig","Erledigt"],["alle","Alle"]].map(o => `<button data-rf="${o[0]}" aria-pressed="${F.rf === o[0]}">${o[1]}</button>`).join("")}</div>
    <button class="btn" data-act="invKaputt" ${darf() ? "" : "disabled"} style="margin-left:auto">${ic.plus} Kaputtes Teil melden</button></div>
    <div class="cards">${rows.map(r => { const i = inv(r.inventar_id), st = REPST[r.status], offen = r.status === "gemeldet" || r.status === "reparatur";
      return `<article class="card meld"><div style="flex:1 1 320px;min-width:0"><div class="row"><span class="chip ${st.c}">${st.l}</span><span class="muted" style="font-size:13px">${deTime(r.erstellt)} · ${esc(r.von_name)}${r.bauvorhaben_id ? " · von " + esc(bvName(r.bauvorhaben_id)) : ""}</span></div>
        <div style="font-size:17px;font-weight:600;margin-top:6px">${nf(r.menge)} × ${esc(i.name)}</div><div class="muted" style="font-size:14px">${esc(r.grund) || "–"}${r.erledigt_am ? " · erledigt " + deTime(r.erledigt_am) + " von " + esc(r.erledigt_von) : ""}</div></div>
        ${buero && offen ? `<div class="row">${r.status === "gemeldet" ? `<button class="btn s" data-act="repSt" data-st="abgelehnt" data-id="${r.id}" ${darf() ? "" : "disabled"}>Ist nicht kaputt</button><button class="btn s p" data-act="repSt" data-st="reparatur" data-id="${r.id}" ${darf() ? "" : "disabled"}>In Reparatur geben</button>` : ""}
          <button class="btn s d" data-act="repSt" data-st="ausgeschieden" data-id="${r.id}" ${darf() ? "" : "disabled"}>Nicht reparierbar</button><button class="btn s p" data-act="repSt" data-st="erledigt" data-id="${r.id}" ${darf() ? "" : "disabled"}>Repariert – zurück ins Lager</button></div>` : ""}</article>`; }).join("") || `<div class="card empty">Nichts in dieser Ansicht.</div>`}</div>
    <p class="hint" style="margin-top:10px">„Nicht reparierbar“ zieht die Teile vom Gesamtbestand ab – danach am besten gleich unter „Nachbestellen“ vormerken.</p>`;
}
function invNachkauf(){
  const F = S.f, liste = S.inv.filter(i => i.bereich === F.ib && i.aktiv);
  const kaeufe = S.invBew.filter(b => b.art === "ZUGANG" && b.gebucht_name !== "Übernahme" && (inv(b.inventar_id) || {}).bereich === F.ib);
  const jahre = uniq(kaeufe.map(b => String(b.datum).slice(0, 4)).concat([S.heute.slice(0, 4)])).reverse();
  if (!F.nkJahr) F.nkJahr = S.heute.slice(0, 4);
  const rows = kaeufe.filter(b => F.nkJahr === "alle" || String(b.datum).startsWith(F.nkJahr));
  const summe = rows.reduce((a, b) => a + (Number(b.betrag) || 0), 0);
  return `<form id="fNachkauf" class="card stack" style="margin-bottom:16px"><div class="sec"><h2>Nachkauf erfassen</h2></div>
    <div class="grid"><label class="f" style="grid-column:span 2"><span>Teil</span><select class="in" name="id" required>${uniq(liste.map(i => i.gruppe)).map(g => `<optgroup label="${esc(g)}">${liste.filter(i => i.gruppe === g).map(i => `<option value="${i.id}">${esc(i.name)}${Number(i.nachbestellen) > 0 ? " · " + nf(i.nachbestellen) + " vorgemerkt" : ""}</option>`).join("")}</optgroup>`).join("")}</select></label>
      <label class="f"><span>Kaufdatum</span><input class="in" type="date" name="datum" value="${S.heute}" required></label>
      <label class="f"><span>Menge</span><input class="in num" inputmode="decimal" name="menge" required></label>
      <label class="f"><span>Lieferant</span><input class="in" name="lief" placeholder="z. B. Doka"></label>
      <label class="f"><span>Betrag gesamt netto €</span><input class="in num" inputmode="decimal" name="betrag" placeholder="0,00"></label></div>
    <label class="f"><span>Kaufbeleg (PDF oder Foto, max. 10 MB)</span><input class="in" type="file" name="beleg" accept="application/pdf,image/*" style="padding-top:9px"></label>
    <div><button class="btn p" ${darf() ? "" : "disabled"}>Speichern &amp; zubuchen</button></div></form>
    <div class="filters" style="align-items:center"><label class="f" style="flex:0 1 160px"><span>Jahr</span><select class="in" data-f="nkJahr">${jahre.map(j => `<option ${j === F.nkJahr ? "selected" : ""}>${j}</option>`).join("")}<option value="alle" ${F.nkJahr === "alle" ? "selected" : ""}>Alle Jahre</option></select></label><span class="muted" style="margin-left:auto">${rows.length} Nachkäufe · Summe ${eur(summe)}</span></div>

function fenster(html, wide){
  schliessen();
  const w = document.createElement("div"); w.id = "ov";
  w.innerHTML = `<div class="box ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  w.addEventListener("mousedown", e => { if (e.target === w) schliessen(); });
  document.body.appendChild(w);
  const first = w.querySelector("input:not([type=hidden]),select,textarea"); if (first) setTimeout(() => first.focus(), 30);
}
function schliessen(){ const o = $("ov"); if (o) { o.remove(); if (!$("app").hidden) render(); } }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("ov")) schliessen(); });

  fenster(`<h2>Neue Buchung</h2><form id="fBuch" class="stack" style="margin-top:12px">

      <div class="f" style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Menge</span><div class="row" style="flex-wrap:nowrap"><input class="in num" inputmode="decimal" name="menge" data-b="menge" value="${esc(B.menge)}" aria-label="Menge" style="flex:1"><select class="in" name="einheit" data-b="einheit" style="width:120px" aria-label="Einheit">${eh.map(e => `<option ${e === B.einheit ? "selected" : ""}>${esc(e)}</option>`).join("")}</select></div></div>
      ${brauchtPreis ? `<label class="f"><span>Preis je ${esc(a ? a.einheit : "Stk.")} € (optional)</span><input class="in num" inputmode="decimal" name="preis" data-b="preis" value="${esc(B.preis)}" placeholder="${a && ek(a.id) ? nf(ek(a.id), 2) : "0,00"}"></label>` : ""}
    </div>
    <label class="f"><span>Bemerkung (optional)</span><input class="in" name="bem" data-b="bem" value="${esc(B.bem || "")}"></label>
    <div id="bCalc">${buchungCalc()}</div>

function buchungCalc(){
  const a = art(Number(B.artikel)); if (!a) return "";
  const m = num(B.menge) || 0, stk = B.einheit === "Palette" ? m * a.pro_palette : m, b = Number(a.bestand), r = Number(a.reserviert), frei = b - r, e = " " + esc(a.einheit);
  const resBv = B.bv ? (S.reserv.find(x => x.artikel_id === a.id && String(x.bauvorhaben_id) === B.bv) || {}).stueck || 0 : 0;
  let t = "", bad = false;
  if (B.art === "AUSGABE") { const ausRes = Math.min(resBv, stk, r); bad = stk - ausRes > frei; t = `= ${nf(stk)}${e}${ausRes ? ` (davon ${nf(ausRes)}${e} aus Reservierung dieser Baustelle)` : ""} · danach im Lager ${nf(b - stk)}${e}${bad ? ` · Nicht genug frei: nur ${nf(Math.max(frei, 0))}${e} verfügbar` : ""}`; }
  else if (B.art === "RESERVIERT") { bad = stk > frei; t = `= ${nf(stk)}${e} · danach frei verfügbar ${nf(frei - stk)}${e}${bad ? " · So viel ist nicht frei" : ""}`; }
  else if (B.art === "RES_STORNO") { bad = stk > resBv; t = `Für diese Baustelle reserviert: ${nf(resBv)}${e}${bad ? " · Es kann höchstens so viel aufgehoben werden" : ""}`; }
  else { const p = num(B.preis), alt = ek(a.id); const neu = p ? (alt > 0 && b > 0 ? (b * alt + stk * p) / (b + stk) : p) : alt; t = `= ${nf(stk)}${e} · danach im Lager ${nf(b + stk)}${e}${neu ? " · Ø Mischpreis " + eur(neu) + (p && alt ? " (bisher " + eur(alt) + ")" : "") : ""}`; }
  return `<div class="calc ${bad ? "bad" : ""}">${t}</div>`;
}

async function belegHochladen(file){
  if (!file || !file.size) return {path: "", name: ""};
  if (file.size > 10 * 1024 * 1024) throw new Error("Der Beleg ist größer als 10 MB.");
  const sauber = file.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_").slice(-80);
  const path = S.me.firma_id + "/" + Date.now() + "-" + sauber;
  const {error} = await sb.storage.from("belege").upload(path, file, {contentType: file.type || "application/octet-stream", upsert: false});
  if (error) throw error;
  return {path, name: file.name};
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-act],[data-auth],[data-m],[data-ib],[data-imod],[data-rf]");
  if (!t) return;
  if (t.dataset.auth) { S.auth = t.dataset.auth; zeigeAuth(); return; }
  if (t.dataset.m) { e.preventDefault(); return meldeKlick(t); }
  if (t.dataset.ib) { S.f.ib = t.dataset.ib; S.f.ig = ""; render(); return; }
  if (t.dataset.imod) { S.f.imod = t.dataset.imod; render(); return; }
  if (t.dataset.rf) { S.f.rf = t.dataset.rf; render(); return; }
  if (t.dataset.tab) { e.preventDefault(); if ($("ov")) schliessen(); S.tab = t.dataset.tab; if (t.dataset.zeige) S.f.zeige = t.dataset.zeige; render(); window.scrollTo({top: 0}); return; }
  const a = t.dataset.act, id = t.dataset.id;
  try {
    if (a === "logout") { await sb.auth.signOut(); S.user = null; S.me = null; S.auth = "login"; zeigeAuth(); }
    else if (a === "preise") preisFenster();
    else if (a === "paket") { window.__pk = t.dataset.v; preisFenster(); }
    else if (a === "install") installFenster();
    else if (a === "zu") schliessen();
    else if (a === "profil") profilFenster();
    else if (a === "buchung") { B = null; buchungFenster(); }
    else if (a === "artikel") { A = null; artikelFenster(id); }
    else if (a === "inventur") inventurFenster(id);
    else if (a === "bv") bvFenster(id);
    else if (a === "excel") excel();
    else if (a === "invBuch") invBuchFenster(id, t.dataset.art, t.dataset.bv);
    else if (a === "invKaputt") invKaputtFenster(id);
    else if (a === "invZaehlen") invZaehlenFenster(id);
    else if (a === "invEdit") invEditFenster(id);
    else if (a === "invAus") { const i = inv(id); if (!window.confirm("„" + i.name + "“ ausblenden? Die Bewegungen bleiben gespeichert.")) return; await rpc("inventar_aktiv", {p_id: i.id, p_aktiv: false}); toast("Ausgeblendet.", "ok"); schliessen(); await nachAktion(["inventar"]); }
    else if (a === "repSt") { await rpc("reparatur_status", {p_id: Number(id), p_status: t.dataset.st}); toast({reparatur: "In Reparatur gegeben.", erledigt: "Repariert – wieder im Lager.", ausgeschieden: "Ausgeschieden und vom Bestand abgezogen.", abgelehnt: "Meldung abgelehnt – Teile wieder im Lager."}[t.dataset.st], "ok"); await nachAktion(["inventar","reparaturen","inventar_bewegungen"]); }
    else if (a === "belegOeffnen") { const w = window.open("", "_blank"); const {data, error} = await sb.storage.from("belege").createSignedUrl(t.dataset.v, 300); if (error) { if (w) w.close(); throw error; } if (w) w.location = data.signedUrl; else location.href = data.signedUrl; }
    else if (a === "kopieren") { try { await navigator.clipboard.writeText(t.dataset.v); toast("Kopiert.", "ok"); } catch (er) { window.prompt("Zum Kopieren:", t.dataset.v); } }
    else if (a === "ausblenden") { const x = art(Number(id)); await rpc("artikel_aktiv", {p_id: x.id, p_aktiv: !x.aktiv}); toast(x.aktiv ? "Artikel ausgeblendet – Bewegungen bleiben erhalten." : "Artikel wieder eingeblendet.", "ok"); A = null; schliessen(); await nachAktion(["artikel"]); }
    else if (a === "bvbew") { S.f.bvf = id; S.f.jahr = S.f.bvJahr || S.heute.slice(0, 4); S.f.monat = ""; S.f.art = ""; S.tab = "bewegungen"; render(); }

    else if (a === "verl") { const m = Number($("ex-" + id).value); const bis = await rpc("firma_verlaengern", {p_id: id, p_monate: m}); toast("Verlängert bis " + deDate(bis) + " – gilt sofort.", "ok"); await ladeHersteller(); render(); }
    else if (a === "sperr") { const f = S.firmen.find(x => x.id === id); await rpc("firma_setzen", {p_id: id, p_paket: f.paket, p_gesperrt: !f.gesperrt, p_bis: null, p_notiz: null}); toast(f.name + (f.gesperrt ? " entsperrt." : " gesperrt."), "ok"); await ladeHersteller(); render(); }
    else if (a === "neuKey") { if (!window.confirm("Neuen Lizenzschlüssel erzeugen? Der alte bleibt gültig, falls er schon eingelöst wurde.")) return; const k = await rpc("firma_neuer_schluessel", {p_id: id}); await ladeHersteller(); render(); toast("Neuer Schlüssel: " + k, "ok"); }
  } catch (err) { fehler(err); t.disabled = false; }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.f !== undefined) { S.f[t.dataset.f] = t.value; if (t.tagName === "SELECT") { if (t.dataset.f === "gruppe") S.f.herst = ""; } const pos = t.selectionStart; $("view").innerHTML = VIEWS[S.tab](); const n = document.querySelector(`[data-f="${t.dataset.f}"]`); if (n) { n.focus(); if (pos != null && n.setSelectionRange) try { n.setSelectionRange(pos, pos); } catch (er) {} } return; }
  if (t.dataset.b !== undefined) { B[t.dataset.b] = t.value; if (["art","artikel","einheit"].includes(t.dataset.b)) { if (t.dataset.b === "artikel") B.preis = ""; buchungFenster(); const n = document.querySelector(`[data-b="${t.dataset.b}"]`); if (n) n.focus(); } else $("bCalc").innerHTML = buchungCalc(); return; }
  if (t.dataset.a !== undefined) { A[t.dataset.a] = t.value; if (["gruppe","herst"].includes(t.dataset.a)) { artikelFenster(A._id); const n = document.querySelector(`[data-a="${t.dataset.a === "gruppe" ? (A.gruppe === "__neu" ? "gneu" : "gruppe") : (A.herst === "__neu" ? "hneu" : "herst")}"]`); if (n) n.focus(); } return; }
  if (t.dataset.m !== undefined) { if (t.dataset.m === "menge") M.menge = num(t.value) || 0; else { M[t.dataset.m] = t.value; if (t.dataset.m === "artikel") { $("view").innerHTML = VIEWS.melden(); const n = document.querySelector('[data-m="artikel"]'); if (n) n.focus(); } } return; }
  if (t.dataset.preis !== undefined) { const m = S.meld.find(x => x.id === Number(t.dataset.preis)); const o = document.querySelector(`[data-misch="${t.dataset.preis}"]`); if (m && o) o.innerHTML = mischTxt(m, num(t.value)); return; }
});
document.addEventListener("change", async e => {
  const t = e.target;
  try {
    if (t.dataset.rolle) { const p = S.profile.find(x => x.id === t.dataset.rolle); await rpc("benutzer_aendern", {p_id: p.id, p_rolle: t.value, p_aktiv: p.aktiv}); toast(p.name + " ist jetzt " + ROLLEN[t.value] + ".", "ok"); await nachAktion(["profile"]); }
    else if (t.dataset.belegNach) { const bel = await belegHochladen(t.files[0]); await rpc("inventar_beleg", {p_bewegung: Number(t.dataset.belegNach), p_beleg: bel.path, p_beleg_name: bel.name}); toast("Beleg gespeichert.", "ok"); await nachAktion(["inventar_bewegungen"]); }
    else if (t.dataset.nb) { const i = inv(t.dataset.nb), pr = S.invP[i.id] || {}; await rpc("inventar_speichern", {p_id: i.id, p_bereich: i.bereich, p_gruppe: i.gruppe, p_name: i.name, p_artnr: i.artnr, p_artnr_verrechnung: i.artnr_verrechnung, p_einheit: i.einheit, p_nachbestellen: num(t.value) || 0, p_notiz: i.notiz, p_miete_exkl: pr.miete_exkl || "", p_miete_inkl: pr.miete_inkl || "", p_ek: pr.ek == null ? null : pr.ek, p_anfangsbestand: null}); await nachAktion(["inventar"]); }
    else if (t.dataset.paket) { const f = S.firmen.find(x => x.id === t.dataset.paket); await rpc("firma_setzen", {p_id: f.id, p_paket: t.value, p_gesperrt: f.gesperrt, p_bis: null, p_notiz: null}); toast("Paket geändert.", "ok"); await ladeHersteller(); render(); }
  } catch (err) { fehler(err); await nachAktion(["profile"]); }
});
function meldeKlick(t){
  const k = t.dataset.m;
  if (k === "art") M.art = t.dataset.v;
  else if (k === "einheit") M.einheit = t.dataset.v;
  else if (k === "plus") M.menge = Math.floor(Number(M.menge) || 0) + 1;
  else if (k === "minus") M.menge = Math.max(1, Math.ceil(Number(M.menge) || 1) - 1);
  else return;
  $("view").innerHTML = VIEWS.melden();
}

/* ===================== Excel ===================== */
function excel(){
  if (!window.XLSX) { toast("Excel-Export konnte nicht geladen werden.", "bad"); return; }
  const wb = XLSX.utils.book_new(), buero = istBuero();
  const best = S.artikel.filter(a => a.aktiv).map(a => { const o = {Materialgruppe: a.gruppe, Hersteller: a.hersteller, Produkt: a.name, "Artikel-Nr.": a.artnr, Einheit: a.einheit, Bestand: Number(a.bestand), Reserviert: Number(a.reserviert), Verfügbar: Number(a.bestand) - Number(a.reserviert), "Je Palette": Number(a.pro_palette) || null}; if (buero) { o["Ø Mischpreis €"] = ek(a.id) || null; o["Lagerwert €"] = ek(a.id) ? Math.round(ek(a.id) * a.bestand * 100) / 100 : null; } o.Status = status(a).l; return o; });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(best), "Lagerbestand");
  if (buero) {
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.bew.map(b => { const a = art(b.artikel_id); return {Datum: deDate(b.datum), Art: ARTEN[b.art].l, Material: artName(a), "Artikel-Nr.": a ? a.artnr : "", "Bauvorhaben/Lieferant": bvName(b.bauvorhaben_id) || b.lieferant, Menge: Number(b.menge), Einheit: b.einheit, Grundeinheit: Number(b.stueck), "Preis €": b.preis != null ? Number(b.preis) : null, "Wert €": b.preis != null ? Math.round(b.preis * Math.abs(b.stueck) * 100) / 100 : null, Bemerkung: b.bemerkung, "Gebucht von": b.gebucht_name}; })), "Bewegungen");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.bv.map(b => ({Nummer: b.nr, Bauvorhaben: b.name, Ort: b.ort, Kunde: b.kunde, Beginn: deDate(b.beginn), Status: b.status}))), "Bauvorhaben");
  }
  if (S.inv.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.inv.filter(i => i.aktiv).map(i => { const o = {Bereich: BEREICHE[i.bereich], Gruppe: i.gruppe, Bezeichnung: i.name, "Art.-Nr. Ausgabe": i.artnr, "Art.-Nr. Verrechnung": i.artnr_verrechnung, Einheit: i.einheit, Gesamt: i.gezaehlt ? Number(i.gesamt) : "nicht gezählt", "Im Lager": i.gezaehlt ? invFrei(i) : null, "Auf Baustellen": Number(i.baustelle), Reparatur: Number(i.reparatur), Nachbestellen: Number(i.nachbestellen) || null, Notiz: i.notiz}; if (buero) { const pr = S.invP[i.id] || {}; o["Miete exkl."] = pr.miete_exkl || ""; o["Miete inkl."] = pr.miete_inkl || ""; } return o; })), "Schalung & Geräte");
  XLSX.writeFile(wb, APP + " " + ((S.liz || {}).firma || "") + " " + S.heute + ".xlsx");
}

window.__bf = {S, render};
})();
</script>
